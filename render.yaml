# Backend on Render. The web app deploys separately on Vercel from frontend/.
#
# Storage note: this runs on SQLite, on the service's own disk. On the free
# plan that disk is wiped on every deploy, so the demo caseload is re-seeded
# each time -- which is what you want for a demo and not what you want for a
# pilot. To keep data between deploys, uncomment the databases block at the
# bottom and the DATABASE_URL entry above it; psycopg2 is already installed.

services:
  - type: web
    name: mabia-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "1"
      # The web app's origin. Vercel preview URLs are allowed by pattern too.
      - key: CORS_ORIGINS
        value: https://mabia-ai.vercel.app
      # This service's own address. Africa's Talking calls back here during a
      # call; without it a call connects and then falls silent.
      - key: PUBLIC_BASE_URL
        value: https://mabia-api.onrender.com
      # Shared secret so the cron below can trigger the outreach run without a
      # user session. Nothing else accepts it.
      - key: CRON_TOKEN
        generateValue: true
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: mabia-db
      #     property: connectionString

  # The loop the product is named for. Without this, contacts are scheduled at
  # enrolment and nobody is ever actually called.
  - type: cron
    name: mabia-outreach
    runtime: python
    rootDir: backend
    plan: free
    schedule: "0 8 * * *"        # 08:00 UTC daily — morning in Ghana
    buildCommand: pip install -r requirements.txt
    startCommand: >
      python -c "import os,urllib.request;
      r=urllib.request.Request('https://mabia-api.onrender.com/api/contacts/run-due',
      method='POST', headers={'X-Cron-Token': os.environ['CRON_TOKEN']});
      print(urllib.request.urlopen(r, timeout=120).read().decode())"
    envVars:
      - key: CRON_TOKEN
        fromService:
          name: mabia-api
          type: web
          envVarKey: CRON_TOKEN

