# Backend on Render. The web app deploys separately on Vercel from frontend/.
#
# Storage note: this runs on SQLite, on the service's own disk. On the free
# plan that disk is wiped on every deploy, so the demo caseload is re-seeded
# each time -- which is what you want for a demo and not what you want for a
# pilot. To keep data between deploys, uncomment the databases block at the
# bottom and the DATABASE_URL entry above it; psycopg2 is already installed.

services:
  - type: web
    name: mabia-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "1"
      # The web app's origin. Vercel preview URLs are allowed by pattern too.
      - key: CORS_ORIGINS
        value: https://mabia-ai.vercel.app
      # This service's own address. Africa's Talking calls back here during a
      # call; without it a call connects and then falls silent.
      - key: PUBLIC_BASE_URL
        value: https://mabia-api.onrender.com
      # Translation and speech. Set these in the Render dashboard, not here --
      # sync:false means Render prompts for the value and never stores it in
      # the repository. Absent, the platform still runs and the Voice screen
      # reports Khaya as unconfigured rather than failing quietly, which is
      # what the live deployment is doing today.
      - key: GHANANLP_API_KEY
        sync: false
      # Telephony. Absent, calls are simulator-only -- enough to demonstrate
      # the whole flow, not enough to reach a real handset.
      #
      # These two were declared here and read by nothing. Every setting came
      # from the Setup screen, which writes to SQLite, which on this plan is
      # wiped on every deploy -- so a key typed in worked until the next push
      # and then stopped, with nothing on screen changing when it did.
      # settings_store now falls back to the environment, so anything set here
      # outlives a deploy and Setup says which source is in force.
      - key: TELEPHONY_PROVIDER
        sync: false
      - key: AT_ENVIRONMENT
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_VOICE_NUMBER
        sync: false
      # The handset the two test buttons ring.
      - key: TEST_PHONE
        sync: false
      # Shared secret so the cron below can trigger the outreach run without a
      # user session. Nothing else accepts it.
      - key: CRON_TOKEN
        generateValue: true
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: mabia-db
      #     property: connectionString

  # The scheduler that used to live here is now .github/workflows/outreach.yml.
  #
  # It was declared as `type: cron` with `plan: free`, and Render has no free
  # plan for a cron service -- "free not a valid plan for service type cron".
  # That is a blueprint validation error, not a runtime one, so the whole file
  # was rejected on every sync and the job has never run in production. The
  # loop this product is named for was configured, committed, and dead.
  #
  # A scheduled GitHub Actions workflow does the same POST on the same
  # schedule, costs nothing, and lives next to the code it triggers. It also
  # wakes the free-plan web service each morning, which the Render cron would
  # have done as a side effect and which nothing else does.

